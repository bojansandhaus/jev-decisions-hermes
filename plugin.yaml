name: jev-decisions
version: "0.10.0"
description: "Jev Decisions Plugin for Hermes: action reviews, local policy, evidence checks, optional smart approval review, local decision supervision, and learned corrections"
author: "Bojan Sandhaus"
license: MIT
homepage: "https://github.com/bojansandhaus/jev-decisions"
toolsets:
  - jev
provides_tools:
  - jev_decide
  - jev_workflow
  - jev_ledger
  - jev_gateway
  - jev_ingest
  - jev_loop
  - jev_supervision
  - jev_lessons
provides_hooks:
  - post_llm_call
  - post_tool_call
  - pre_tool_call
