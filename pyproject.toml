[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-decisions"
version = "0.10.5"
description = "Safety checks that help Hermes and other AI agents decide when to act, ask, or verify"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Bojan Sandhaus"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
py-modules = [
    "__init__",
    "closed_loop",
    "cockpit",
    "fabric",
    "gateway",
    "ingest",
    "jev_case",
    "jev_cockpit",
    "jev_gateway",
    "ledger",
    "lessons",
    "runtime",
    "shadow_report",
    "supervision",
    "verification",
    "approval_policy",
    "approval_review",
    "jev_client",
]

[project.scripts]
jev-gateway = "jev_gateway:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

